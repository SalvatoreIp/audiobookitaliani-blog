baseURL = 'https://www.audiobookitaliani.com/'
languageCode = 'it-IT'
title = 'AudioBook Italiani - Recensioni e Guide'
theme = 'PaperMod'

[params]
  description = "Recensioni audiobook, libri e guide all'ascolto in italiano"
  author = "AudioBook Italiani Team"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  defaultTheme = "auto"

  [params.homeInfoParams]
    Title = "AudioBook Italiani"
    Content = """Guide pratiche e recensioni di audiolibri in italiano: chi li legge, quanto durano, dove ascoltarli e quanto costano. Narratori, durate e prezzi li controlliamo sui cataloghi ufficiali e indichiamo sempre il mese della verifica.

**Da dove iniziare**

- [Audible vale la pena? Prezzi e quando conviene](/recensioni/audible-vale-la-pena-2026/)
- [Audiolibri gratis: dove ascoltarli legalmente](/posts/audiolibri-gratis-dove-ascoltarli-legalmente-2026/)
- [Audiolibri su Spotify: come funziona in Italia](/recensioni/spotify-audiolibri-italia-2026/)
- [Storytel o Audible: quale scegliere](/recensioni/storytel-vs-audible-confronto-2026/)
- [Kindle Unlimited (ora Kindle+): guida pratica](/kindle/kindle-unlimited-guida-2026/)
- [I 10 audiolibri più ascoltati su Audible in Italia](/posts/audiolibri-piu-ascoltati-audible-italia/)"""

[[params.socialIcons]]
  name = "telegram"
  url = "https://t.me/audiobookitaliani_news"






[[menu.main]]
  identifier = "recensioni"
  name = "Recensioni"
  url = "/recensioni/"
  weight = 10

[[menu.main]]
  identifier = "posts"
  name = "Guide e classifiche"
  url = "/posts/"
  weight = 20

[[menu.main]]
  identifier = "kindle"
  name = "Kindle"
  url = "/kindle/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "Chi siamo"
  url = "/about/"
  weight = 40

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

canonifyURLs = false
relativeURLs = false


[markup.goldmark.renderer]
  unsafe = true
